name: data

# Полные клоны шести проектов нужны, только если поменялась выгрузка.
on:
  push:
    paths: [extract.py, fetch.sh, repos.txt, "data/**", .github/workflows/data.yml]
  workflow_dispatch:

jobs:
  data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Данные выгружаются заново байт в байт
        run: |
          ./fetch.sh
          git status --porcelain data/
          test -z "$(git status --porcelain data/)"
